# Builds the mod on every push to main, starts a real server with each jar on Linux, Windows and
# macOS (tools/smoke_test.py), and only then keeps the newest jars on the "latest" release.
# A tag such as v1.0.0 makes a release of its own, with that version's part of CHANGELOG.md as notes.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Collect the jars (one per loader)
        run: |
          mkdir -p jars
          for j in */build/libs/*.jar; do case "$j" in *-sources*|*-dev*) ;; *) cp "$j" jars/ ;; esac; done
          ls -la jars
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: jars/*.jar

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        loader: [fabric, neoforge]
        way: [datapack, world-type]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.loader }} / ${{ matrix.way }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
      - name: Start a server and make an Earth world
        shell: bash
        run: |
          jar=$(ls jars/earth-worldgen-${{ matrix.loader }}-*.jar)
          python tools/smoke_test.py ${{ matrix.loader }} "$jar" "$RUNNER_TEMP/server" ${{ matrix.way == 'world-type' && '--world-type' || '' }}

  release:
    needs: [build, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars

      - name: Update the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest && git push -f origin latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest build" \
              --notes "Built automatically from the newest commit on main. For a tested version, use the newest numbered release if there is one."
          fi
          for old in $(gh release view latest --json assets --jq '.assets[].name'); do gh release delete-asset latest "$old" -y; done
          gh release upload latest jars/*.jar --clobber

      - name: Make a numbered release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{on = index($0, "## " v) == 1; next} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "${GITHUB_REF_NAME}" jars/*.jar --title "Earth Worldgen ${version}" --notes-file notes.md
