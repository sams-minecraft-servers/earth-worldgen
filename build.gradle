plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = 'tj.earth'
base { archivesName = 'earth-worldgen' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

// The datapack goes inside the jar too, so the mod can install it into a new world by itself.
def datapackZip = tasks.register('datapackZip', Zip) {
    from 'datapack'
    archiveFileName = 'datapack.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/datapack/earth_worldgen')
}

processResources {
    dependsOn datapackZip
    from(layout.buildDirectory.dir('generated/datapack'))
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': inputs.properties.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
