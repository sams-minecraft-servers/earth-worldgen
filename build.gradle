plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java'
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
    group = 'tj.earth'

    // The shared code and resources, and the datapack (inside the jar, so the mod can install it into a new world).
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    def datapackZip = tasks.register('datapackZip', Zip) {
        from rootProject.file('datapack')
        archiveFileName = 'datapack.zip'
        destinationDirectory = layout.buildDirectory.dir('generated/datapack/earth_worldgen')
    }
    processResources {
        dependsOn datapackZip
        from(layout.buildDirectory.dir('generated/datapack'))
        // The same world-generation files as the mod's own data, so the "Earth" world type (Create
        // World > World Type, or level-type=earth_worldgen:earth) works without the datapack. Only the
        // mod's own names: the datapack's changes to the game's own entries (the overworld and its
        // height, strongholds) stay in the datapack, so other worlds are left alone.
        from(rootProject.file('datapack/data/earth_worldgen')) { into 'data/earth_worldgen' }
        from(rootProject.file('datapack/data/minecraft/dimension_type/overworld.json')) {
            into 'data/earth_worldgen/dimension_type'
            rename { 'earth.json' }
        }
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand 'version': inputs.properties.version }
    }

    java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
    tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
}
